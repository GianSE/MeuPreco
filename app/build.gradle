plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.meupreco'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.meupreco"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17

        // Desugaring: permite usar java.time.LocalDate com minSdk 24
        // (nativamente o LocalDate só existe a partir do Android 8 / API 26).
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'

    // Room: persistência em banco SQLite (Entrega Final).
    implementation 'androidx.room:room-runtime:2.8.5'
    annotationProcessor 'androidx.room:room-compiler:2.8.5'

    // Biblioteca de desugaring do java.time (LocalDate).
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
