# Memoria do processo do Gradle. 1,5 GB e suficiente para um projeto de um
# modulo e deixa RAM livre para o Android Studio em maquinas com 8-10 GB.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Reaproveita resultados de builds anteriores (compilacao mais rapida).
org.gradle.caching=true

# O projeto tem apenas o modulo :app, entao a compilacao em paralelo nao
# traria ganho e so consumiria mais memoria.
org.gradle.parallel=false

android.useAndroidX=true
android.nonTransitiveRClass=true
